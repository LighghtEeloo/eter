[package]
name = "eter"
version = "0.0.1"
edition = "2024"
description = "An immutable persistent entry store protocol."
license = "MIT"

[features]
lmdb = ["dep:heed"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
toml = "0.8"
tracing = "0.1"
heed = { version = "0.22.0", optional = true }

[dev-dependencies]
tempfile = "3.27"
